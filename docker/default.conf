server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    charset utf-8;
    server_tokens off;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Sense això el navegador pot servir JS/CSS antics per heurística
    # (Last-Modified) i l'usuari no veurà els canvis. `no-cache` = revalida
    # sempre amb ETag (304, barat) i només canvia quan realment canvia el fitxer.
    add_header Cache-Control "no-cache, must-revalidate" always;
    add_header X-Content-Type-Options "nosniff" always;

    # --- API de dades (usuaris, tokens, pacients, fàrmacs) ---------------
    # El contenedor de l'API no publica cap port: tot passa per aquí.
    location /api/ {
        proxy_pass http://glp1-api:8001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_connect_timeout 10s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
        client_max_body_size 20m;
    }

    # Encaminament: la rutesa és hash (#/p/…), així que qualsevol ruta servim index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~* \.(js|css)$ {
        try_files $uri =404;
        add_header Cache-Control "no-cache, must-revalidate" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    access_log /dev/stdout;
    error_log  /dev/stderr warn;
}
